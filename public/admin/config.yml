# Админка Snowfirefly (Decap CMS). Открывается по адресу https://<сайт>/admin
backend:
  name: github
  repo: Sahara009/snowfirefly
  branch: main

locale: ru

# куда кладутся загруженные фото
media_folder: public/img/uploads
public_folder: /img/uploads

collections:
  - name: catalog
    label: Каталог
    editor:
      preview: false
    files:
      - name: products
        label: Свечи
        file: src/data/products.json
        format: json
        fields:
          - label: Товары
            name: items
            widget: list
            label_singular: свечу
            summary: "{{fields.title}} · {{fields.tag}}"
            fields:
              - label: ID (латиницей, без пробелов, не повторяется)
                name: id
                widget: string
                pattern: ["^[a-z0-9-]+$", "Только маленькие латинские буквы, цифры и дефис, например rose-big"]
              - { label: Название, name: title, widget: string }
              - { label: Короткое описание, name: text, widget: text }
              - label: Категория
                name: tag
                widget: select
                options: ["Цветы", "Букеты", "Десерты", "Фигурные", "Зверята", "Новый год", "В баночках"]
              - label: Фото (лучше вертикальное, до 1–2 МБ)
                name: image
                widget: image
                required: false
                choose_url: false
              - label: Цена, ₸ (пусто — «цена по запросу»)
                name: price
                widget: number
                value_type: int
                min: 0
                required: false
              - label: Показывать в витрине «Коллекции»
                name: featured
                widget: boolean
                default: false
                required: false
              - label: Что важнее на фото (кадрирование)
                name: position
                widget: select
                required: false
                options:
                  - { label: По центру, value: "50% 50%" }
                  - { label: Верх, value: "50% 0%" }
                  - { label: Низ, value: "50% 100%" }
              - label: Видео вместо фото (путь, необязательно)
                name: video
                widget: string
                required: false
              - label: Обложка видео (путь, необязательно)
                name: poster
                widget: string
                required: false
